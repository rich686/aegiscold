name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Licenses
        run: |
          ANDROID_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          mkdir -p "$ANDROID_ROOT/licenses"
          # 自动接受主流 Android SDK 协议
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_ROOT/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_ROOT/licenses/android-sdk-preview-license"
          yes | $ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          # 检查原生 Android 工程，如不存在则创建并同步
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: Collect APK File
        run: |
          mkdir -p output-apk
          # 查找生成的 debug apk 并统一重命名为 AegisCold-debug.apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file was generated!"
            exit 1
          fi
          echo "Found generated APK: $APK_PATH"
          cp "$APK_PATH" output-apk/AegisCold-debug.apk
          ls -lh output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisCold-Android-APK
          path: output-apk/AegisCold-debug.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/AegisCold-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
