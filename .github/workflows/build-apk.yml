name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Init and Sync Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps
          npx cap init "AegisCold" "com.aegiscold.wallet" --web-dir dist --yes || true
          npx cap add android || true
          npx cap sync android

      - name: Fix Android SDK Versions to 36
        run: |
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle
          fi
          # 直接修改 app/build.gradle 里的具体数值
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk .*/compileSdk 36/g' android/app/build.gradle
            sed -i 's/targetSdk .*/targetSdk 36/g' android/app/build.gradle
            sed -i 's/minSdk .*/minSdk 24/g' android/app/build.gradle
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisCold-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
