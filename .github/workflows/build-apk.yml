name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: '打包类型 (Build Type)'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release-unsigned'
          - 'both'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Found package-lock.json, installing dependencies..."
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            echo "No package-lock.json found. Installing dependencies via npm install..."
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application
        run: |
          npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android project not found. Initializing Android platform via Capacitor..."
            npx cap add android
          fi
          echo "Syncing web assets to Capacitor Android..."
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          mkdir -p output-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apks/AegisCold-debug.apk

      - name: Build Release (Unsigned) APK
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release-unsigned' || github.event.inputs.build_type == 'both') }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
          cd ..
          mkdir -p output-apks
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk output-apks/AegisCold-release-unsigned.apk || cp android/app/build/outputs/apk/release/*.apk output-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AegisCold-Android-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
