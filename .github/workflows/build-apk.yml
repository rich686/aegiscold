name: Build & Package App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Web App & Output Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Found package-lock.json. Installing dependencies..."
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            echo "Installing dependencies via npm install..."
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application
        run: |
          npm run build

      - name: Package Distribution Bundle
        run: |
          mkdir -p release-bundle
          # 压缩 dist 静态产物供直接下载与部署
          zip -r release-bundle/AegisCold-Web-Package.zip dist/
          # 拷贝编译好的 dist 目录作为备用产物
          cp -r dist release-bundle/dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AegisCold-Build-Artifacts
          path: |
            release-bundle/AegisCold-Web-Package.zip
            dist/
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-bundle/AegisCold-Web-Package.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
